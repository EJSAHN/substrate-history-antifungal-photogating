[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uvsm-substrate-history"
version = "1.2.1"
description = "Reproducible UVSM morphology and fluorescence analyses without figure generation"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.13,<2", "statsmodels>=0.14,<0.15", "scikit-learn>=1.5,<2", "openpyxl>=3.1,<4"]
license = {file = "LICENSE"}

[project.scripts]
uvsm-analyze = "uvsm.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uvsm = ["schema/*.json"]
